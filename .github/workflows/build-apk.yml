name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Android APK
      working-directory: android
      run: gradle assembleDebug --stacktrace

    - name: Upload APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UniversalDownloader-APK
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Publish Release APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        name: "Universal Downloader v2.0.0 (Latest Stable APK)"
        body: |
          ### ⚡ Universal Downloader Android App v2.0.0
          
          **What's New in this Build:**
          - **Instant Launch (Zero Black Screen):** Bundled offline UI shell loads in under 0.1s.
          - **Dual Engine Connectivity:** Works globally over secure Cloudflare tunnel and local Wi-Fi.
          - **Android Share Sheet Integration:** Share videos/reels directly from YouTube, Instagram, and Facebook.
          - **High-Resolution Native Icon:** Crisp app launcher icon for all Android screen densities.
          - **Native Download Manager:** Saves videos, MP3s, and images directly to your phone's `Downloads` folder.
        files: android/app/build/outputs/apk/debug/app-debug.apk
